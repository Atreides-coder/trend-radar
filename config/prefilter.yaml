# 确定性 Prefilter 规则：只过滤"确定不需要"的内容，其余全部交给 LLM。
# 原则：宁可多送，不要误杀。融资 / 收购 / 产品发布 / GitHub 项目 / 论文 / benchmark 都不在这里过滤。
#
# 每条规则：
#   reason:   写入 raw_items.filter_reason
#   field:    title | tags | url     （tags 为 RSS 自带分类标签，大小写敏感、整词匹配）
#   patterns: 正则列表（title / url 不区分大小写），命中任意一条即过滤
#   sources:  可选，只对这些 source 生效
#   unless_engagement_gte: 可选，engagement 达到该值时放行（如影响巨大的 CVE）

rules:

  # ---------- 广告 / affiliate / 导购 ----------
  - reason: promotion
    field: tags
    patterns: ["Coupons", "coupons", "Deals", "Gear / Deals", "Gear / Buying Guides",
               "gift guides", "Verge Shopping", "sponsored", "Sponsored"]

  - reason: promotion
    field: title
    patterns:
      - '\b(promo|coupon|discount) codes?\b'
      - '\b\d{1,3}% off\b'
      - '\$\d+ off\b'
      - '\bprime (big deal )?day(s)? deals?\b'
      - '\bbest .{0,40}\bdeals\b'
      - '\bgift guide\b'

  # ---------- 无信息量的活动宣传 ----------
  - reason: event_promo
    field: title
    patterns:
      - '\b(early[- ]bird|register now|last chance to|days? left to|save up to \$)'
      - 'don.t miss this .{0,20}deal'
      - '\b(expo\+?|all[- ]access) pass\b'
      - '^techcrunch disrupt 20\d\d'
      - '\bwebinar\b'

  # ---------- Podcast 单集 / Newsletter 自我推广 ----------
  - reason: podcast_newsletter
    field: tags
    patterns: ["Podcast", "Podcasts", "Newsletters", "The Download", "Behind The Blog"]

  - reason: podcast_newsletter
    field: title
    patterns:
      - '^podcast:'
      - '^the download:'
      - '\bepisode \d+\b'
      - '^subscribe to\b'

  # ---------- 招聘 ----------
  - reason: job_post
    field: title
    patterns:
      - '^ask hn: who (is hiring|wants to be hired)'
      - '^ask hn: freelancer\? seeking freelancer'
      - '\(yc [swf]\d\d\) is hiring\b'
      - '\b(is|are|we.re) hiring\b'
      - '^(ask hn|tell hn): .{0,40}(looking for (a job|work)|find(ing)? a job|job search)'
      - '\bopens applications for\b'

  # ---------- 纯教程 ----------
  # 注意：不按 "How to ..." 标题或 How-To 标签过滤——
  # 像 "How to Collect CDs" 这类内容可能正是消费回潮的信号，交给 LLM 判断。
  - reason: tutorial
    field: title
    patterns:
      - '\btutorial\b'
      - '\bstep[- ]by[- ]step\b'
      - '\bbeginner.s guide\b'
      - '\bcheat ?sheet\b'

  # ---------- 小版本 / patch / changelog ----------
  - reason: minor_update
    field: title
    patterns:
      - '\bv?\d+\.\d+\.[1-9]\d*\b.{0,30}\b(released?|is out|available|update)\b'
      - '\b(released?|announcing|update) .{0,40}\bv?\d+\.\d+\.[1-9]\d*\b'
      - '\b(patch|bug ?fix|point|maintenance) release\b'
      - '\b(changelog|release notes)\b'

  # ---------- 普通 PR / issue / commit / 纯 bug fix ----------
  - reason: pure_technical
    field: url
    patterns:
      - 'github\.com/[^/]+/[^/]+/(pull|issues|commit)/'
      - 'gitlab\.com/.+/-/(merge_requests|issues|commit)/'

  - reason: pure_technical
    field: title
    patterns:
      - '^(fix|bugfix|hotfix|chore|refactor)(\(.+\))?:'

  # ---------- 安全 CVE（影响巨大的靠 engagement 放行） ----------
  - reason: security_cve
    field: title
    patterns: ['\bCVE-\d{4}-\d{3,}\b']
    unless_engagement_gte: 300
